name: VM5 Mergify speculative push trust probe
on:
  push:
    branches:
      - 'mergify/merge-queue/**'

permissions:
  contents: write

jobs:
  trust-probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run repository CI hook
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash ci/vm5-mq-hook.sh
